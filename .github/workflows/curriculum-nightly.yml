name: Curriculum Nightly

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lessons:
    name: Validate + run every lesson's tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate lessons
        run: node scripts/build-curriculum.mjs --check

      - name: Generator unit tests
        run: node --test scripts/__tests__/*.test.mjs

      - name: Lesson tests
        run: node scripts/run-lesson-tests.mjs --all

      - name: Deprecation scan (informational)
        continue-on-error: true
        run: node scripts/build-curriculum.mjs --deprecations

  links:
    name: Dead-link check (curriculum + reference docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Root-relative links (/docs/..., /learn/...) are Docusaurus routes, not files.
      # The site build checks them (onBrokenLinks: throw), so lychee maps them to a
      # fake root and skips them; relative ../file.md links are still checked.
      # 502/503/504 are accepted: a remote gateway having a bad night is not a dead
      # page, and a really dead link shows up as 404/410 or a DNS/connection error.
      - run: mkdir -p lychee

      # First pass never fails the job: it records failures as JSON for the recheck.
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,201,204,206,301,302,307,308,429,502,503,504
            --max-concurrency 8
            --timeout 30
            --max-retries 3
            --retry-wait-time 5
            --root-dir /__site_routes__
            --exclude '^file:///__site_routes__'
            'curriculum/**/*.md'
            'website/docs/**/*.md'
            'README.md'
            'ROADMAP.md'
            'LESSON_TEMPLATE.md'
          format: json
          output: lychee/first.json
          fail: false

      # A site that times out or refuses connections for a few minutes (coredns.io,
      # gnu.org) is not a dead link. Collect the failed http(s) URLs, wait, and check
      # only those again. A missing local file cannot recover, so it fails at once.
      - name: Collect failed links for a recheck
        id: collect
        if: steps.lychee.outputs.exit_code != '0'
        run: |
          python3 - <<'PY'
          import json, os
          report = json.load(open("lychee/first.json"))
          web, local = set(), set()
          for name in ("error_map", "timeout_map"):
              for source, entries in report.get(name, {}).items():
                  for entry in entries:
                      url = entry["url"]
                      print(f"first pass: {url} ({entry['status']['text']}) in {source}")
                      (web if url.startswith(("http://", "https://")) else local).add(url)
          with open("lychee/recheck.txt", "w") as f:
              f.write("".join(u + "\n" for u in sorted(web)))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"web={len(web)}\nlocal={len(local)}\n")
          print(f"{len(web)} web link(s) to recheck, {len(local)} broken local link(s)")
          PY

      - name: Fail on broken local links
        if: steps.collect.outputs.local != '' && steps.collect.outputs.local != '0'
        run: |
          echo "::error::${{ steps.collect.outputs.local }} relative link(s) point at files that do not exist; see the 'Collect failed links' step"
          exit 1

      - name: Wait before the recheck
        if: steps.collect.outputs.web != '' && steps.collect.outputs.web != '0'
        run: sleep 600

      - name: Recheck failed links
        if: steps.collect.outputs.web != '' && steps.collect.outputs.web != '0'
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,201,204,206,301,302,307,308,429,502,503,504
            --timeout 60
            --max-retries 3
            --retry-wait-time 10
            lychee/recheck.txt
          output: lychee/recheck.md
          fail: true

      - name: Open or update an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Nightly link check found dead links';
            const {data: open} = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'outdated',
            });
            const existing = open.find((i) => i.title === title);
            const body = `The nightly link check failed on ${new Date().toISOString().slice(0, 10)}.\n\n` +
              `See the run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
              `Fix the links or add a pattern to \`.lycheeignore\` if the target is legitimately unreachable from CI.`;
            if (existing) {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body});
            } else {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['outdated', 'content']});
            }
