name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./website/package-lock.json

      - name: Install dependencies
        run: npm ci

      # onBrokenLinks is set to 'throw' in docusaurus.config.ts,
      # so this build fails on any broken internal link.
      - name: Build (fails on broken links)
        run: npm run build

  curriculum:
    name: Curriculum (validate + lesson tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Fails on any lesson that does not follow LESSON_TEMPLATE.md
      - name: Validate lessons
        run: node scripts/build-curriculum.mjs --check

      - name: Generator unit tests
        run: node --test scripts/__tests__/

      # Each lesson's code/tests, run from its own folder (python unittest, bash -n, ...)
      - name: Lesson tests
        run: node scripts/run-lesson-tests.mjs --all
