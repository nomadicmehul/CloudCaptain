name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./website/package-lock.json

      - name: Install dependencies
        run: npm ci

      # onBrokenLinks is set to 'throw' in docusaurus.config.ts,
      # so this build fails on any broken internal link.
      - name: Build (fails on broken links)
        run: npm run build
