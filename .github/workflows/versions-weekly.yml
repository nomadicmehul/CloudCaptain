name: Update Tracked Tool Versions

on:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: versions-weekly
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    if: github.repository == 'nomadicmehul/CloudCaptain'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh curriculum/versions.json from GitHub releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-versions.mjs

      # No [skip ci]: a version bump should rebuild the site so lesson pages show it.
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add curriculum/versions.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update: tracked tool versions"
            git push
          fi
