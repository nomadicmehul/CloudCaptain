name: Lesson Smoke (real tools on Linux)

# Runs each lesson's code/smoke.sh: the Build It steps that need Linux root
# (namespaces, cgroups) and the Use It commands with the real tools (Docker,
# OpenTofu). This is what makes a lesson's commands "verified".

on:
  pull_request:
    paths:
      - 'curriculum/**'
      - 'scripts/**'
      - '.github/workflows/lesson-smoke.yml'
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One job per phase, in parallel, each with its own kind cluster: the whole
  # curriculum no longer fits one runner's time budget, and a failure points at
  # its phase directly.
  plan:
    runs-on: ubuntu-latest
    outputs:
      phases: ${{ steps.list.outputs.phases }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: list
        run: echo "phases=$(node scripts/run-lesson-tests.mjs --list-phases --smoke)" >> "$GITHUB_OUTPUT"

  smoke:
    needs: plan
    name: smoke (${{ matrix.phase }})
    runs-on: ubuntu-latest
    # Capstones grade three whole projects (reference solution and starter) in one job.
    timeout-minutes: ${{ matrix.phase == 'capstones' && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        phase: ${{ fromJSON(needs.plan.outputs.phases) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      # A throwaway cluster so the kubectl/MCP lessons' Use It steps run for real
      - uses: helm/kind-action@v1
        with:
          cluster_name: cc-smoke
          wait: 120s

      - name: Tool versions
        run: |
          docker --version
          tofu -version | head -1
          python3 --version
          uname -r

      - name: Run the smoke scripts of phase ${{ matrix.phase }}
        run: node scripts/run-lesson-tests.mjs --all --smoke --phase=${{ matrix.phase }}
