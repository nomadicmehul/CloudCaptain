# CloudCaptain capstone grader for __ID__.
# Copy this file to .github/workflows/cloudcaptain-grade.yml in your project
# repository (the one you started from starter/). Every push grades the project
# and writes the score table to the run's summary page.
name: CloudCaptain capstone grade

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: project

      # The grader is fetched from CloudCaptain, so it stays current and
      # your repository does not need a copy of it.
      - uses: actions/checkout@v4
        with:
          repository: nomadicmehul/CloudCaptain
          path: cloudcaptain
          sparse-checkout: curriculum/phases/16-capstones/__DIR__

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Grade
        run: bash cloudcaptain/curriculum/phases/16-capstones/__DIR__/grader/grade.sh project
