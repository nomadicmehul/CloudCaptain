name: CI

on:
  push:
    branches: [main, "release/**"]
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/**"
      - "!**.md"
  pull_request:
    paths-ignore: ["docs/**"]
  workflow_dispatch:

env:
  STAGE: workflow
  APP: shop

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      checksum: ${{ steps.meta.outputs.checksum }}
    steps:
      - name: Announce
        run: echo "CC-JOB build"
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compute metadata
        id: meta
        run: |
          {
            echo "version=$(cat VERSION)"
            echo "checksum=$(cksum src/app.py | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
      - name: Pick a flavour
        run: echo "BUILD_FLAVOR=release" >> "$GITHUB_ENV"
      - name: Show the flavour
        run: echo "CC-ENV flavor=$BUILD_FLAVOR"
      - name: Use the secret
        env:
          TOKEN: ${{ secrets.API_TOKEN }}
        run: echo "CC-SECRET token=$TOKEN"
      - name: Hash the lock file
        env:
          LOCK_HASH: ${{ hashFiles('requirements.txt') }}
        run: echo "CC-HASH requirements=$LOCK_HASH"
      - name: Leave a file in the workspace
        run: echo "left by build" > leak.txt
      - name: Done
        if: always()
        run: echo "CC-DONE build"

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 3
      matrix:
        python: ["3.11", "3.12", "3.13"]
        os: [linux, macos]
        exclude:
          - python: "3.11"
            os: macos
        include:
          - python: "3.13"
            os: linux
            coverage: true
          - python: "3.14"
            os: linux
    steps:
      - name: Announce
        run: echo "CC-JOB test"
      - name: Report the leg
        env:
          LEG_OS: ${{ matrix.os }}
          LEG_PYTHON: ${{ matrix.python }}
        run: echo "CC-MATRIX os=$LEG_OS python=$LEG_PYTHON"
      - name: Coverage
        if: matrix.coverage
        env:
          LEG_PYTHON: ${{ matrix.python }}
        run: echo "CC-COVERAGE python=$LEG_PYTHON"
      - name: Done
        if: always()
        run: echo "CC-DONE test"

  experimental:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - name: Announce
        run: echo "CC-JOB experimental"
      - name: Try the nightly toolchain
        run: |
          echo "the nightly toolchain is broken today"
          exit 1
      - name: Done
        if: always()
        run: echo "CC-DONE experimental"

  deps:
    if: ${{ !github.event.act }}
    runs-on: ubuntu-latest
    steps:
      - name: Announce
        run: echo "CC-JOB deps"
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore the dependency cache
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            deps-${{ runner.os }}-
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .deps
          sed 's/^/installed /' requirements.txt > .deps/installed.txt
          echo "CC-CACHE miss"
      - name: Report a cache hit
        if: steps.cache.outputs.cache-hit == 'true'
        run: echo "CC-CACHE hit"
      - name: Bundle
        run: |
          mkdir -p dist
          cp .deps/installed.txt VERSION dist/
      - name: Upload the bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: dist/
      - name: Done
        if: always()
        run: echo "CC-DONE deps"

  package:
    needs: deps
    runs-on: ubuntu-latest
    steps:
      - name: Announce
        run: echo "CC-JOB package"
      - name: Download the bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: bundle
      - name: Inspect the bundle
        run: echo "CC-ARTIFACT version=$(cat bundle/VERSION) packages=$(grep -c . bundle/installed.txt)"
      - name: Done
        if: always()
        run: echo "CC-DONE package"

  deploy:
    needs: [build, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      STAGE: job
    steps:
      - name: Announce
        run: echo "CC-JOB deploy"
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the build outputs
        env:
          VERSION: ${{ needs.build.outputs.version }}
          CHECKSUM: ${{ needs.build.outputs.checksum }}
        run: echo "CC-OUTPUT version=$VERSION checksum=$CHECKSUM"
      - name: Look for the file build left
        run: |
          if [ -e leak.txt ]; then echo "CC-LEAK present"; else echo "CC-LEAK absent"; fi
      - name: Job env
        run: echo "CC-ENV job-stage=$STAGE app=$APP"
      - name: Step env
        env:
          STAGE: step
        run: echo "CC-ENV step-stage=$STAGE"
      - name: Done
        if: always()
        run: echo "CC-DONE deploy"

  notify:
    needs: [test, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Announce
        run: echo "CC-JOB notify"

  cleanup:
    needs: [deploy, experimental]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Announce
        run: echo "CC-JOB cleanup"
      - name: Results seen
        env:
          DEPLOY: ${{ needs.deploy.result }}
          EXPERIMENTAL: ${{ needs.experimental.result }}
        run: echo "CC-SEEN deploy=$DEPLOY experimental=$EXPERIMENTAL"
      - name: Done
        if: always()
        run: echo "CC-DONE cleanup"
