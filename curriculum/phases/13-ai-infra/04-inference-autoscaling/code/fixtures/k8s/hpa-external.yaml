apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cc-sim
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cc-sim
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: External
      external:
        metric:
          name: vllm_requests_in_flight
          selector:
            matchLabels:
              deployment: cc-sim
        target:
          type: AverageValue
          averageValue: "4"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
