apiVersion: apps/v1
kind: Deployment
metadata:
  name: cc-sim
  labels:
    app: cc-sim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cc-sim
  template:
    metadata:
      labels:
        app: cc-sim
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: sim
          image: ghcr.io/llm-d/llm-d-inference-sim:v1.0.0
          args:
            - --model
            - cc-tiny
            - --port
            - "8000"
            - --max-num-seqs
            - "2"
            - --time-to-first-token
            - 1s
            - --inter-token-latency
            - 20ms
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cc-sim
spec:
  selector:
    app: cc-sim
  ports:
    - name: http
      port: 8000
      targetPort: 8000
