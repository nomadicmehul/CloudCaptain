apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-web
  labels:
    app: checkout-web
    backstage.io/kubernetes-id: checkout-web
spec:
  replicas: 0
  selector:
    matchLabels: {app: checkout-web}
  template:
    metadata:
      labels: {app: checkout-web}
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
